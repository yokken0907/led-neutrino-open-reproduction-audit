abstract: "We report a partial computational replication of the Brane-Dirac spectrum in Figure 1 of de Giorgi, Pasari, and Turner, together with a bounded audit of an attempted open reconstruction of their experiment-level exclusion contours. The successful replicated subset is restricted to Eqs. (3.26)-(3.28) and Figure 1. Independent infinite-tower and finite-KK implementations agree at nine preregistered anchors with a maximum mass difference of 1.29e-9, and the truncated sums of N_lambda^2 exceed the target paper's 99% numerical criterion for all three published parameter choices. A conditioning audit over 3552 roots resolves an initially failed raw-residual diagnostic: every root lies within the requested solver-coordinate tolerance, with a maximum normalized backward error of 0.2501, and two worst cases are confirmed at 80-digit precision. Four digitized Daya Bay points from Figure 5 do not yield unique pointwise replication candidates because the open comparator has multiple local threshold crossings inside each digitization interval. The public Daya Bay covariance-fit reference is independently reproduced to an absolute chi-square difference of 1.33e-11, while an earlier fixed-coordinate profiling route is shown to be non-equivalent. The [Re] claim is therefore restricted to the theoretical Figure-1 subset; no exclusion-contour replication, new LED signal, or error in the original analysis is claimed."

